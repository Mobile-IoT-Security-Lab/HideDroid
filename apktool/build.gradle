apply plugin: "com.android.library"

android {
    namespace 'apktool.module'
    compileSdkVersion 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // brut.androlib (vendored apktool 3.0.3) uses java.nio.file.Files/Path
        // throughout, which don't exist below API 26 without desugaring.
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 3
        versionName "1.2"
    }
}

dependencies {
    implementation project(path: ':apksig')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

    // Vendored apktool 3.0.3 (brut.androlib et al, Apache-2.0) under
    // src/main/java/brut/** - it isn't published anywhere (Maven Central stops
    // at 2.11.1, JitPack is deliberately disabled upstream), so it's built from
    // source here. Its own dependencies, pinned to what apktool 3.0.3 itself uses:
    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'xmlpull:xmlpull:1.1.3.1'
    // Official smali/baksmali releases are stalled (github.com/google/smali/issues/100);
    // apktool itself builds against this JitPack'd fork commit.
    implementation 'com.github.iBotPeaches.smali:smali:b6365a84f4'
    implementation 'com.github.iBotPeaches.smali:smali-baksmali:b6365a84f4'
}
