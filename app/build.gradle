apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'realm-android'

realm {
    syncEnabled = true;
}

android {
    namespace 'it.unige.hidedroid'
    compileSdkVersion 33
// Do NOT upgrade!

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "it.unige.hidedroid"
        minSdkVersion 23
        targetSdkVersion 28  // Do NOT upgrade!
        versionCode 5
        versionName "1.4"
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt',
                    'META-INF/ASL2.0'
            ]
        }
    }
    ndkVersion '22.0.7026061'

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "version"
    productFlavors {
        fat {
            ndk {
                abiFilters "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            }
        }

        x86 {
            ndk {
                abiFilters "x86", "x86_64"
            }
        }

        arm {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }

    // Verify every packaged native library has PT_LOAD segments aligned to 16 KB,
    // which is mandatory on Android 15+ devices with 16 KB memory pages.
    applicationVariants.all { variant ->
        def variantName = variant.name
        def stripTask = tasks.findByName("strip${variantName.capitalize()}DebugSymbols")
        if (stripTask != null) {
            stripTask.doLast {
                def strippedLibsDir = file("${buildDir}/intermediates/stripped_native_libs/${variantName}/out/lib")
                if (strippedLibsDir.exists()) {
                    strippedLibsDir.eachFileRecurse { soFile ->
                        if (soFile.name.endsWith('.so')) {
                            verifyElfLoadAlignment(soFile)
                        }
                    }
                }
            }
        }
    }
}

def verifyElfLoadAlignment(File elf) {
    if (!elf.exists() || elf.length() < 52) return
    def bytes = elf.bytes
    if (bytes[0] != 0x7f || bytes[1] != 0x45 || bytes[2] != 0x4c || bytes[3] != 0x46) return

    def is64 = bytes[4] == 2
    def littleEndian = bytes[5] == 1
    def order = littleEndian ? java.nio.ByteOrder.LITTLE_ENDIAN : java.nio.ByteOrder.BIG_ENDIAN
    def buf = java.nio.ByteBuffer.wrap(bytes).order(order)

    def e_phoff, e_phentsize, e_phnum
    if (is64) {
        e_phoff = buf.getLong(32)
        e_phentsize = buf.getShort(54)
        e_phnum = buf.getShort(56)
    } else {
        e_phoff = buf.getInt(28)
        e_phentsize = buf.getShort(42)
        e_phnum = buf.getShort(44)
    }

    def pAlignOffset = is64 ? 48 : 28
    for (int i = 0; i < e_phnum; i++) {
        def phdrStart = (int) (e_phoff + i * e_phentsize)
        def pType = buf.getInt(phdrStart)
        if (pType == 1) { // PT_LOAD
            def pAlign = is64 ? buf.getLong(phdrStart + pAlignOffset) : buf.getInt(phdrStart + pAlignOffset)
            if (pAlign % 16384L != 0) {
                throw new GradleException(
                    "${elf.absolutePath}: PT_LOAD segment ${i} alignment 0x${Long.toHexString(pAlign)} is not a multiple of 16 KB (0x4000). " +
                    "Rebuild the library with -Wl,-z,max-page-size=16384 or upgrade the dependency."
                )
            }
        }
    }
}

repositories {
    maven { url "https://www.jitpack.io" }
    mavenCentral()

}

realm {
    syncEnabled = true
}

dependencies {
    implementation project(":apktool")
    implementation project(":netbare-core")
    implementation project(":netbare-injector")
    implementation project(":anonymization-data")
    implementation project(":realmdatahelper")

    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.6.1'

    // APKTOOL
    implementation "net.dongliu:apk-parser:2.6.10"

    // PERMISSIONS
    implementation 'com.karumi:dexter:6.2.0'

    // UI
    implementation "com.github.GrenderG:Toasty:1.4.2"
    implementation 'androidx.core:core-ktx:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.1.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.1.0'
    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'
    implementation 'com.github.leandroborgesferreira:loading-button-android:2.3.0-SNAP2'
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.2.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.2.0"
    implementation 'me.zhanghai.android.materialprogressbar:library:1.6.1'


    // Thread
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.7"

    // VPN
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.github.tiann:FreeReflection:3.2.2'

    // database
    implementation 'com.github.satyan:sugar:1.5'
    implementation 'com.beust:klaxon:5.6'

    // https://mvnrepository.com/artifact/io.netty/netty-all
    implementation group: 'io.netty', name: 'netty-all', version: '4.1.18.Final'

    //Apache FileUpload library
    implementation 'commons-fileupload:commons-fileupload:1.4'

}
